[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["data", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
  "E501",  # long lines are fine for prompts and embedded SQL
  "B008",  # function-call-in-default is how FastAPI dependency injection works
]

[tool.ruff.lint.per-file-ignores]
# eval scripts and conftest bootstrap sys.path before importing the project.
"eval/*" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
