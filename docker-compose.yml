services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      REPO_WORKDIR: /app/data/repos
    restart: unless-stopped

  # Optional Qdrant server: `docker compose --profile qdrant up`
  # then set VECTOR_BACKEND=qdrant and QDRANT_URL=http://qdrant:6333.
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant-server:/qdrant/storage
